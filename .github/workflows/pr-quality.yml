name: PR Quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: pr-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changeset-gate:
    name: Changeset Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip for changeversion release PR
        if: ${{ startsWith(github.head_ref, 'chore/release/changeversion-') }}
        run: echo "Skipping Changeset Gate for automated changeversion release PR."

      - name: Checkout
        if: ${{ !startsWith(github.head_ref, 'chore/release/changeversion-') }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node
        if: ${{ !startsWith(github.head_ref, 'chore/release/changeversion-') }}
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify changeset for releasable package changes
        if: ${{ !startsWith(github.head_ref, 'chore/release/changeversion-') }}
        env:
          CHANGESET_CHECK_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: node scripts/changeset-check.mjs

  ci-scope:
    name: CI Scope
    runs-on: ubuntu-latest
    needs: changeset-gate
    timeout-minutes: 5
    outputs:
      scope_json: ${{ steps.scope.outputs.scope_json }}
      fast_mode: ${{ steps.scope.outputs.fast_mode }}
      fast_required: ${{ steps.scope.outputs.fast_required }}
      browser_required: ${{ steps.scope.outputs.browser_required }}
      run_web: ${{ steps.scope.outputs.run_web }}
      run_xterm: ${{ steps.scope.outputs.run_xterm }}
      browser_matrix: ${{ steps.scope.outputs.browser_matrix }}
      windows_required: ${{ steps.scope.outputs.windows_required }}
    steps:
      - name: Checkout
        if: ${{ !startsWith(github.head_ref, 'chore/release/changeversion-') }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Detect CI scope
        id: scope
        env:
          CI_SCOPE_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          CI_SCOPE_HEAD_SHA: ${{ github.sha }}
          SKIP_CHANGEVERSION: ${{ startsWith(github.head_ref, 'chore/release/changeversion-') }}
        run: |
          if [ "$SKIP_CHANGEVERSION" = "true" ]; then
            echo 'scope_json={"affectedPackages":[],"browser":{"required":false,"runWeb":false,"runXterm":false},"changedFiles":[],"directPackages":[],"fast":{"lintTargets":[],"mode":"skip","required":false,"runFormatCheck":false,"runReferenceCheck":false,"runRootTests":false,"testPackages":[],"typecheckPackages":[]},"reason":"Skip automated changeversion release PR."}' >> "$GITHUB_OUTPUT"
            echo 'fast_mode=skip' >> "$GITHUB_OUTPUT"
            echo 'fast_required=false' >> "$GITHUB_OUTPUT"
            echo 'browser_required=false' >> "$GITHUB_OUTPUT"
            echo 'run_web=false' >> "$GITHUB_OUTPUT"
            echo 'run_xterm=false' >> "$GITHUB_OUTPUT"
            echo 'browser_matrix=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/ci-scope.mjs

  quality-fast:
    name: Fast Gate
    runs-on: ubuntu-latest
    needs: [changeset-gate, ci-scope]
    timeout-minutes: 20
    steps:
      - name: Skip for changeversion release PR
        if: ${{ startsWith(github.head_ref, 'chore/release/changeversion-') }}
        run: echo "Skipping Fast Gate for automated changeversion release PR."

      - name: Checkout
        if: ${{ !startsWith(github.head_ref, 'chore/release/changeversion-') }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        if: ${{ !startsWith(github.head_ref, 'chore/release/changeversion-') }}
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        if: >-
          !startsWith(github.head_ref, 'chore/release/changeversion-') &&
          (needs.ci-scope.outputs.fast_mode == 'full' || needs.ci-scope.outputs.fast_mode == 'scoped')
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        if: >-
          !startsWith(github.head_ref, 'chore/release/changeversion-') &&
          (needs.ci-scope.outputs.fast_mode == 'full' || needs.ci-scope.outputs.fast_mode == 'scoped')
        run: pnpm install --frozen-lockfile

      - name: Prepare pinned OpenSpec CLI
        if: >-
          !startsWith(github.head_ref, 'chore/release/changeversion-') &&
          (needs.ci-scope.outputs.fast_mode == 'full' || needs.ci-scope.outputs.fast_mode == 'scoped')
        run: node scripts/prepare-openspec-reference.mjs

      - name: No Fast Gate work required
        if: >-
          !startsWith(github.head_ref, 'chore/release/changeversion-') &&
          needs.ci-scope.outputs.fast_mode == 'skip'
        run: echo "No Fast Gate work required for this PR scope."

      - name: Run Fast Gate commands
        if: >-
          !startsWith(github.head_ref, 'chore/release/changeversion-') &&
          needs.ci-scope.outputs.fast_mode != 'skip'
        env:
          CI_SCOPE_JSON: ${{ needs.ci-scope.outputs.scope_json }}
        run: node scripts/ci-fast-gate.mjs

  quality-windows:
    name: Windows Portability Gate
    runs-on: windows-latest
    needs: [changeset-gate, ci-scope]
    if: needs.ci-scope.outputs.windows_required != 'false'
    timeout-minutes: 45
    steps:
      - name: Skip for changeversion release PR
        if: ${{ startsWith(github.head_ref, 'chore/release/changeversion-') }}
        shell: pwsh
        run: Write-Output 'Skipping Windows Portability Gate for automated changeversion release PR.'

      - name: Skip for Windows-neutral scope
        if: ${{ needs.ci-scope.outputs.windows_required == 'false' }}
        shell: pwsh
        run: |
          Write-Output 'Skipping Windows Portability Gate: docs-only or website-only PR has no Windows portability surface.'

      # GitHub runner TEMP is the 8.3 short form (RUNNER~1); where.exe, realpath, and libuv
      # fs-event reporting canonicalize to the long form, and mixing the two breaks path
      # assertions and crashes libuv directory watchers. Pin TEMP/TMP to the long form.
      - name: Canonicalize TEMP to the long path form
        if: ${{ !startsWith(github.head_ref, 'chore/release/changeversion-') }}
        shell: pwsh
        run: |
          $sig = '[DllImport("kernel32.dll", SetLastError=true, CharSet=CharSet.Unicode)] public static extern uint GetLongPathName(string lpszShortPath, System.Text.StringBuilder lpszLongPath, uint cchBuffer);'
          $kernel32 = Add-Type -MemberDefinition $sig -Name Kernel32 -Namespace Win32 -PassThru
          $buffer = New-Object System.Text.StringBuilder 1024
          [void]$kernel32::GetLongPathName($env:TEMP, $buffer, $buffer.Capacity)
          $longTemp = $buffer.ToString()
          if ($longTemp -notmatch '~') { Write-Output "TEMP long form: $longTemp" }
          else { Write-Error "GetLongPathName did not expand TEMP: $longTemp"; exit 1 }
          "TEMP=$longTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$longTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Checkout
        if: ${{ !startsWith(github.head_ref, 'chore/release/changeversion-') }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        if: ${{ !startsWith(github.head_ref, 'chore/release/changeversion-') }}
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        if: >-
          !startsWith(github.head_ref, 'chore/release/changeversion-') &&
          (needs.ci-scope.outputs.fast_mode == 'full' || needs.ci-scope.outputs.fast_mode == 'scoped')
        uses: pnpm/action-setup@v4

      - name: Setup Bun
        if: >-
          !startsWith(github.head_ref, 'chore/release/changeversion-') &&
          (needs.ci-scope.outputs.fast_mode == 'full' || needs.ci-scope.outputs.fast_mode == 'scoped')
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        if: >-
          !startsWith(github.head_ref, 'chore/release/changeversion-') &&
          (needs.ci-scope.outputs.fast_mode == 'full' || needs.ci-scope.outputs.fast_mode == 'scoped')
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Prepare pinned OpenSpec CLI
        if: >-
          !startsWith(github.head_ref, 'chore/release/changeversion-') &&
          (needs.ci-scope.outputs.fast_mode == 'full' || needs.ci-scope.outputs.fast_mode == 'scoped')
        shell: pwsh
        run: node scripts/prepare-openspec-reference.mjs

      - name: Run Windows test gate
        if: >-
          !startsWith(github.head_ref, 'chore/release/changeversion-') &&
          needs.ci-scope.outputs.fast_mode != 'skip'
        shell: pwsh
        run: pnpm test:ci

      - name: Run Windows typecheck gate
        if: >-
          !startsWith(github.head_ref, 'chore/release/changeversion-') &&
          needs.ci-scope.outputs.fast_mode != 'skip'
        shell: pwsh
        run: pnpm typecheck

      # The offline smoke resolves package.json ranges (e.g. the optional node-pty peer), but a
      # cold frozen-lockfile install never writes range metadata to the pnpm mirror. Install the
      # packed tarball once online so the shared store and mirror match a real developer machine;
      # the smoke itself then proves the offline install path against that warmed cache.
      - name: Warm pnpm cache for the offline smoke
        if: >-
          !startsWith(github.head_ref, 'chore/release/changeversion-') &&
          needs.ci-scope.outputs.fast_mode != 'skip'
        shell: pwsh
        run: |
          $warm = Join-Path $env:TEMP ("openspecui-warm-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $warm | Out-Null
          pnpm --filter openspecui pack --pack-destination $warm 2>$null | Out-Null
          $tgz = (Get-ChildItem $warm -Filter *.tgz | Select-Object -First 1).FullName
          if (-not $tgz) { Write-Error "pack produced no tarball in $warm"; exit 1 }
          Push-Location $warm
          pnpm init | Out-Null
          pnpm add --ignore-workspace $tgz
          if ($LASTEXITCODE -ne 0) { Pop-Location; Write-Error "warm install failed"; exit 1 }
          Pop-Location
          Remove-Item -Recurse -Force $warm

      - name: Build and smoke installed Windows CLI
        if: >-
          !startsWith(github.head_ref, 'chore/release/changeversion-') &&
          needs.ci-scope.outputs.fast_mode != 'skip'
        shell: pwsh
        run: |
          pnpm --filter openspecui build
          bun scripts/windows-installed-cli-smoke.sh.ts

  quality-browser-shard:
    name: Browser Gate (${{ matrix.label }})
    runs-on: ubuntu-latest
    needs: [quality-fast, ci-scope]
    if: >-
      !startsWith(github.head_ref, 'chore/release/changeversion-') &&
      needs.ci-scope.outputs.browser_required == 'true'
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --user 1001
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.ci-scope.outputs.browser_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run browser shard
        run: ${{ matrix.test_command }}

  quality-browser:
    name: Browser Gate
    runs-on: ubuntu-latest
    needs: [ci-scope, quality-browser-shard]
    timeout-minutes: 5
    if: ${{ always() }}
    steps:
      - name: Skip for changeversion release PR
        if: ${{ startsWith(github.head_ref, 'chore/release/changeversion-') }}
        run: echo "Skipping Browser Gate aggregation for automated changeversion release PR."

      - name: Skip when browser coverage is not required
        if: >-
          !startsWith(github.head_ref, 'chore/release/changeversion-') &&
          needs.ci-scope.outputs.browser_required != 'true'
        run: echo "No browser-relevant changes detected; Browser Gate passes without shard execution."

      - name: Verify browser shards
        if: >-
          !startsWith(github.head_ref, 'chore/release/changeversion-') &&
          needs.ci-scope.outputs.browser_required == 'true'
        env:
          SHARD_RESULT: ${{ needs.quality-browser-shard.result }}
        run: |
          echo "Browser shard result: ${SHARD_RESULT}"
          test "${SHARD_RESULT}" = "success"
